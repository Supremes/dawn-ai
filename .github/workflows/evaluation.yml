name: Agent Evaluation Tests

on:
  push:
    branches: [master, feat/multi-agent]
    paths:
      - 'src/main/java/com/dawn/ai/agent/**'
      - 'src/main/java/com/dawn/ai/rag/**'
      - 'src/main/java/com/dawn/ai/memory/**'
      - 'src/test/java/com/dawn/ai/evaluation/**'
      - 'src/test/resources/evaluation/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1g'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dawn
          POSTGRES_PASSWORD: dawn123
          POSTGRES_DB: dawn_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawn -d dawn_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install pgvector extension
        run: |
          PGPASSWORD=dawn123 psql -h localhost -p 5432 -U dawn -d dawn_ai -c "CREATE EXTENSION IF NOT EXISTS vector;"
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: dawn
          PGPASSWORD: dawn123

      - name: Run evaluation tests
        run: |
          mvn test -Dgroups=evaluation -Dsurefire.useFile=false
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          BASE_URL: ${{ secrets.LLM_BASE_URL }}
          CHAT_MODEL: ${{ secrets.LLM_MODEL }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dawn_ai
          SPRING_DATASOURCE_USERNAME: dawn
          SPRING_DATASOURCE_PASSWORD: dawn123
          SPRING_DATA_REDIS_HOST: localhost

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: target/evaluation-reports/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
