  <rect width="1320" height="1370" fill="#FDFAF4"/>

  <text x="660" y="50" text-anchor="middle" class="ink" font-size="26" font-weight="bold">io.micrometer:context-propagation 全流程</text>
  <text x="660" y="78" text-anchor="middle" class="gry" font-size="13.5">把 ThreadLocal 变成可搬运的：提交线程拍快照 → 工作线程还原 → 结束后擦干净。Reactor / Spring 6 / Micrometer Tracing 底层都靠它</text>
  <path d="M300,90 Q660,85 1020,90" fill="none" class="sGry" stroke-width="2" filter="url(#rough)"/>

  <!-- ═══════ ① 问题 ═══════ -->
  <g filter="url(#soft)">
    <rect x="40" y="110" width="250" height="150" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <g filter="url(#rough)">
    <rect x="300" y="110" width="980" height="150" rx="12" fill="#FCF2F1" class="sRed" stroke-width="2.4"/>
  </g>
  <text x="165" y="142" text-anchor="middle" class="ink big">① 问题</text>
  <text x="165" y="172" text-anchor="middle" class="ink xs">ThreadLocal 只对</text>
  <text x="165" y="190" text-anchor="middle" class="ink xs">当前线程可见</text>
  <text x="165" y="228" text-anchor="middle" class="red tb">线程一换就丢</text>

  <g filter="url(#soft)">
    <rect x="330" y="140" width="220" height="76" rx="8" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="645" y="140" width="260" height="76" rx="8" fill="#EFEAE0" class="sGry" stroke-width="2"/>
    <rect x="1000" y="140" width="250" height="76" rx="8" fill="#F6DEDB" class="sRed" stroke-width="2.2"/>
  </g>
  <text x="440" y="168" text-anchor="middle" class="ink tb">提交线程</text>
  <text x="440" y="192" text-anchor="middle" class="grn codeb">TL = ctx@1a2b  ✓</text>
  <text x="775" y="168" text-anchor="middle" class="ink tb">线程切换点</text>
  <text x="775" y="192" text-anchor="middle" class="gry xs">线程池 · Reactor · CompletableFuture</text>
  <text x="1125" y="168" text-anchor="middle" class="ink tb">工作线程</text>
  <text x="1125" y="192" text-anchor="middle" class="red codeb">TL = null  ✗ → NPE</text>

  <path d="M550,178 Q597,175 640,178" fill="none" class="sBlu" stroke-width="2.4" marker-end="url(#aBlu)"/>
  <path d="M905,178 Q950,175 995,178" fill="none" class="sRed" stroke-width="2.4" stroke-dasharray="5 5" marker-end="url(#aRed)"/>

  <text x="790" y="241" text-anchor="middle" class="gry xs">MDC traceId · Security context · StepCollector · AiInteractionContext —— 全在虚线那一跳断掉</text>

  <!-- ═══════ ② 四个核心 API ═══════ -->
  <g filter="url(#soft)">
    <rect x="40" y="278" width="250" height="210" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <g filter="url(#rough)">
    <rect x="300" y="278" width="980" height="210" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2.4"/>
  </g>
  <text x="165" y="310" text-anchor="middle" class="ink big">② 四个核心 API</text>
  <text x="165" y="340" text-anchor="middle" class="ink xs">两个你实现（Accessor）</text>
  <text x="165" y="358" text-anchor="middle" class="ink xs">两个库提供（Registry / Snapshot）</text>
  <text x="165" y="400" text-anchor="middle" class="blu tb">Accessor 注册进 Registry</text>
  <text x="165" y="424" text-anchor="middle" class="blu tb">Snapshot 负责搬运</text>
  <text x="165" y="462" text-anchor="middle" class="gry xs">都在 io.micrometer.context 包下</text>

  <g filter="url(#soft)">
    <rect x="320" y="298" width="222" height="170" rx="10" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="560" y="298" width="222" height="170" rx="10" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="800" y="298" width="222" height="170" rx="10" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="1040" y="298" width="222" height="170" rx="10" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="330" y="432" width="202" height="28" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="570" y="432" width="202" height="28" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="810" y="432" width="202" height="28" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="1050" y="432" width="202" height="28" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
  </g>

  <!-- card 1 -->
  <text x="334" y="324" class="blu codeb">ThreadLocalAccessor&lt;T&gt;</text>
  <text x="334" y="344" class="gry xs">你实现 · 一个 TL 怎么读写清</text>
  <text x="334" y="368" class="ink code">key()</text>
  <text x="460" y="368" class="gry xs">唯一 id</text>
  <text x="334" y="386" class="ink code">getValue()</text>
  <text x="460" y="386" class="gry xs">读</text>
  <text x="334" y="404" class="ink code">setValue(v)</text>
  <text x="460" y="404" class="gry xs">写 / 还原</text>
  <text x="334" y="422" class="ink code">setValue()</text>
  <text x="460" y="422" class="gry xs">清</text>
  <text x="431" y="451" text-anchor="middle" class="blu xs" font-weight="bold">告诉库：这个 TL 长啥样</text>

  <!-- card 2 -->
  <text x="574" y="324" class="blu codeb">ContextAccessor&lt;R,W&gt;</text>
  <text x="574" y="344" class="gry xs">你实现（可选）· 非 TL 容器</text>
  <text x="574" y="368" class="ink code">readValues(...)</text>
  <text x="700" y="368" class="gry xs">从容器读</text>
  <text x="574" y="386" class="ink code">writeValues(...)</text>
  <text x="700" y="386" class="gry xs">写回容器</text>
  <text x="574" y="404" class="ink code">ReactorContextAccessor</text>
  <text x="574" y="422" class="gry xs">└→ 库自带，Reactor 直接用</text>
  <text x="671" y="451" text-anchor="middle" class="blu xs" font-weight="bold">适配 Reactor Context / Map</text>

  <!-- card 3 -->
  <text x="814" y="324" class="blu codeb">ContextRegistry</text>
  <text x="814" y="344" class="gry xs">库提供 · 全局登记表</text>
  <text x="814" y="368" class="ink code">getInstance()</text>
  <text x="940" y="368" class="gry xs">全局单例</text>
  <text x="814" y="386" class="ink code">registerThreadLocalAccessor</text>
  <text x="814" y="404" class="ink code">registerContextAccessor</text>
  <text x="814" y="422" class="gry xs">└→ 启动时注册一次即可</text>
  <text x="911" y="451" text-anchor="middle" class="blu xs" font-weight="bold">登记：哪些 TL 要被搬</text>

  <!-- card 4 -->
  <text x="1054" y="324" class="blu codeb">ContextSnapshot(Factory)</text>
  <text x="1054" y="344" class="gry xs">库提供 · 不可变快照 + 搬运</text>
  <text x="1054" y="368" class="ink code">captureAll()</text>
  <text x="1180" y="368" class="gry xs">拍 TL</text>
  <text x="1054" y="386" class="ink code">captureFrom(ctx)</text>
  <text x="1180" y="386" class="gry xs">拍容器</text>
  <text x="1054" y="404" class="ink code">wrap(task)</text>
  <text x="1180" y="404" class="gry xs">带着跑</text>
  <text x="1054" y="422" class="ink code">setThreadLocals()</text>
  <text x="1180" y="422" class="gry xs">手动还原</text>
  <text x="1151" y="451" text-anchor="middle" class="blu xs" font-weight="bold">真正干活的搬运工</text>

  <!-- ═══════ ③ 全流程 ═══════ -->
  <g filter="url(#soft)">
    <rect x="40" y="506" width="250" height="350" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <g filter="url(#rough)">
    <rect x="300" y="506" width="980" height="350" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2.4"/>
  </g>
  <text x="165" y="538" text-anchor="middle" class="ink big">③ 全流程</text>
  <text x="165" y="568" text-anchor="middle" class="ink xs">一次 submit 到底发生了什么</text>
  <text x="60" y="604" class="ink code">var snap = factory</text>
  <text x="60" y="622" xml:space="preserve" class="ink code">    .captureAll();</text>
  <text x="60" y="640" class="ink code">pool.submit(</text>
  <text x="60" y="658" xml:space="preserve" class="ink code">    snap.wrap(task));</text>
  <text x="165" y="704" text-anchor="middle" class="blu tb">captureAll = 拍照</text>
  <text x="165" y="728" text-anchor="middle" class="blu tb">wrap = 带着照片跑</text>
  <text x="165" y="770" text-anchor="middle" class="gry xs">偷懒写法：</text>
  <text x="165" y="790" text-anchor="middle" class="ink code">ContextExecutorService</text>
  <text x="165" y="808" text-anchor="middle" class="ink code">.wrap(pool)</text>
  <text x="165" y="838" text-anchor="middle" class="gry xs">= SessionAwareExecutor 的库版</text>

  <!-- 泳道 -->
  <text x="330" y="534" class="blu tb">提交线程 (caller)</text>
  <text x="830" y="534" class="blu tb">工作线程 (worker)</text>
  <path d="M790,546 Q788,680 790,812" fill="none" class="sGry" stroke-width="2" stroke-dasharray="6 4"/>

  <g filter="url(#soft)">
    <rect x="330" y="550" width="420" height="66" rx="8" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="330" y="640" width="420" height="66" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="2.2"/>
    <rect x="330" y="730" width="420" height="66" rx="8" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="830" y="550" width="420" height="66" rx="8" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
    <rect x="830" y="640" width="420" height="66" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="2.2"/>
    <rect x="830" y="730" width="420" height="66" rx="8" fill="#FFFFFF" class="sBlu" stroke-width="2"/>
  </g>

  <text x="350" y="574" class="blu codeb">① factory.captureAll()</text>
  <text x="350" y="596" class="ink xs">对 registry 里每个 accessor 调 getValue()　← 必须在提交线程调</text>
  <text x="350" y="664" class="blu codeb">② ContextSnapshot  (不可变 Map)</text>
  <text x="350" y="686" class="ink code">{ stepCollector→ctx@1a2b, session→State@3c4d, span→… }</text>
  <text x="350" y="754" class="blu codeb">③ snapshot.wrap(task) → pool.submit(wrapped)</text>
  <text x="350" y="776" class="ink xs">快照被闭包捕获，随任务进队列；此刻还没换线程</text>

  <text x="850" y="574" class="blu codeb">④ snapshot.setThreadLocals()  → Scope</text>
  <text x="850" y="596" class="ink xs">对每个 accessor 调 setValue(v)，先记住旧值</text>
  <text x="850" y="664" class="grn codeb">⑤ task.run()  — 原任务照常跑</text>
  <text x="850" y="686" class="ink xs">TL 已还原：traceId / StepCollector 全在 ✓</text>
  <text x="850" y="754" class="blu codeb">⑥ scope.close()  → 复原旧值 / 清空</text>
  <text x="850" y="776" class="ink xs">线程还给池子前擦干净，下一个请求不串号</text>

  <path d="M540,616 Q541,628 540,636" fill="none" class="sBlu" stroke-width="2.4" marker-end="url(#aBlu)"/>
  <path d="M540,706 Q541,718 540,726" fill="none" class="sBlu" stroke-width="2.4" marker-end="url(#aBlu)"/>
  <path d="M1040,616 Q1041,628 1040,636" fill="none" class="sBlu" stroke-width="2.4" marker-end="url(#aBlu)"/>
  <path d="M1040,706 Q1041,718 1040,726" fill="none" class="sGrn" stroke-width="2.4" marker-end="url(#aGrn)"/>
  <path d="M752,763 Q806,763 806,672 Q806,583 826,583" fill="none" class="sBlu" stroke-width="2.6" marker-end="url(#aBlu)"/>
  <text x="812" y="632" class="amb xs" font-weight="bold">线程切换</text>

  <text x="790" y="834" text-anchor="middle" class="gry xs">①②③ 在提交线程 · ④⑤⑥ 在工作线程 —— 中间隔着任意长的排队时间，快照把两者解耦</text>

  <!-- ═══════ ④ 三种接法 ═══════ -->
  <g filter="url(#soft)">
    <rect x="40" y="874" width="250" height="210" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <g filter="url(#rough)">
    <rect x="300" y="874" width="980" height="210" rx="12" fill="#F2F8F4" class="sGrn" stroke-width="2.4"/>
