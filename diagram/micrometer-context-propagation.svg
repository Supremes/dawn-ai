  <text x="336" y="1146" class="amb tb">① 快照时机</text>
  <text x="336" y="1170" class="ink xs">captureAll 必须在提交</text>
  <text x="336" y="1188" class="ink xs">线程调；进了池子再拍，</text>
  <text x="336" y="1206" class="ink xs">拍到的全是 null</text>

  <text x="576" y="1146" class="amb tb">② Scope 必须 close</text>
  <text x="576" y="1170" class="ink xs">线程池复用线程；不复原</text>
  <text x="576" y="1188" class="ink xs">上一个请求的 ctx 就会</text>
  <text x="576" y="1206" class="ink xs">串到下一个 —— 用 try-with</text>

  <text x="816" y="1146" class="amb tb">③ 引用 vs 拷贝</text>
  <text x="816" y="1170" class="ink xs">StepCollectorContext 按</text>
  <text x="816" y="1188" class="ink xs">引用传播，多线程共写</text>
  <text x="816" y="1206" class="ink xs">→ 对象内部必须线程安全</text>

  <text x="1056" y="1146" class="amb tb">④ resilience4j 线程池</text>
  <text x="1056" y="1170" class="ink xs">ThreadPoolBulkhead /</text>
  <text x="1056" y="1188" class="ink xs">TimeLimiter 自带池子，</text>
  <text x="1056" y="1206" class="ink xs">不包一层 ctx 就断在这一跳</text>

  <!-- ═══ 结论条 ═══ -->
  <g filter="url(#soft)">
