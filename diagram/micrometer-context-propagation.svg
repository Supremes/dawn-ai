  <text x="165" y="1134" text-anchor="middle" class="ink big">⑤ 四个坑</text>
  <text x="165" y="1164" text-anchor="middle" class="ink xs">用起来简单</text>
  <text x="165" y="1182" text-anchor="middle" class="ink xs">踩坑都在时机和清理</text>
  <text x="165" y="1222" text-anchor="middle" class="amb tb">resilience4j 要特别看</text>

  <g filter="url(#soft)">
    <rect x="320" y="1120" width="222" height="112" rx="10" fill="#F8E9CE" class="sAmb" stroke-width="2.2"/>
    <rect x="560" y="1120" width="222" height="112" rx="10" fill="#F8E9CE" class="sAmb" stroke-width="2.2"/>
