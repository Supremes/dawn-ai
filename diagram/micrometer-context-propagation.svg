  <text x="165" y="906" text-anchor="middle" class="ink big">④ 三种接法</text>
  <text x="165" y="936" text-anchor="middle" class="ink xs">从手动到全自动</text>
  <text x="165" y="954" text-anchor="middle" class="ink xs">看你的线程模型选</text>
  <text x="165" y="996" text-anchor="middle" class="grn tb">dawn-ai 三种都在用</text>
  <text x="165" y="1030" text-anchor="middle" class="gry xs">每张卡片底部</text>
  <text x="165" y="1048" text-anchor="middle" class="gry xs">└→ 对应项目文件</text>

  <g filter="url(#soft)">
