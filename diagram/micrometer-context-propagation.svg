  <text x="338" y="920" class="grn tb">A. 手动 · 自己的线程池</text>
  <text x="338" y="944" class="ink code">snapshot.wrap(task)</text>
  <text x="338" y="962" class="ink code">ContextExecutorService.wrap(pool)</text>
  <text x="338" y="986" class="ink xs">适用：ExecutorService · CF.supplyAsync</text>
  <text x="338" y="1004" class="ink xs">ThreadPoolBulkhead / TimeLimiter 的池子</text>
  <text x="470" y="1040" text-anchor="middle" class="grn codeb">└→ SessionAwareExecutor.java:80</text>

  <text x="658" y="920" class="grn tb">B. Reactor · 一行开关</text>
  <text x="658" y="944" class="ink code">Hooks.enableAutomatic-</text>
  <text x="658" y="962" xml:space="preserve" class="ink code">      ContextPropagation()</text>
  <text x="658" y="986" class="ink xs">适用：WebFlux · Spring AI 流式调用</text>
  <text x="658" y="1004" class="ink xs">订阅时 captureFrom，每个 operator 前还原</text>
  <text x="790" y="1040" text-anchor="middle" class="grn codeb">└→ AgentConfig.java:119-123</text>

  <text x="978" y="920" class="grn tb">C. 框架自带 · 零代码</text>
  <text x="978" y="944" class="ink code">micrometer-tracing-bridge-*</text>
  <text x="978" y="962" class="ink code">Spring Boot 3 / Spring 6</text>
  <text x="978" y="986" class="ink xs">自动搬：traceId / spanId / MDC</text>
  <text x="978" y="1004" class="ink xs">Observation 跨线程仍是同一条 trace</text>
  <text x="1110" y="1040" text-anchor="middle" class="grn codeb">└→ pom.xml: tracing-bridge-otel</text>

