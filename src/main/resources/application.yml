spring:
  application:
    name: dawn-ai

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # DataSource (PostgreSQL with pgvector extension)
  datasource:
    url: jdbc:postgresql://localhost:5432/dawn_ai
    username: dawn
    password: dawn123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis (Conversation Memory)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  # Spring AI - OpenAI
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${BASE_URL}
      chat:
        base-url: ${CHAT_BASE_URL:${BASE_URL}}
        api-key: ${CHAT_API_KEY:${OPENAI_API_KEY}}
        options:
          model: ${CHAT_MODEL}
          temperature: 0.7
          max-tokens: 8192
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${BASE_URL}}
        api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY}}
        options:
          model: ${EMBEDDING_MODEL}
          encodingFormat: float
          dimensions: ${EMBEDDING_DIMENSIONS:1024}

    # Vector Store - PGVector
    vectorstore:
      pgvector:
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        initialize-schema: true

server:
  port: 8080

# Actuator & Prometheus Metrics + OTLP tracing → Langfuse
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, skills
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:3001/api/public/otel/v1/traces}
      compression: gzip
      headers:
        Authorization: Basic ${LANGFUSE_AUTH_BASE64:}

# Application config
app:
  ai:
    react:
      max-steps: 10        # 单次对话最多工具调用次数（超出时作为工具观察返回，要求 LLM 停止工具调用并总结）
      show-steps: true    # 响应体中是否包含 steps 详情
      plan-enabled: true   # 是否启用执行前规划（关闭后跳过 TaskPlanner)
    stream:
      timeout-ms: 1200000   # SSE 单次请求最大等待时长（毫秒）
    rag:
      tool-enabled: true          # 是否把 knowledgeSearchTool 暴露给 Agent；测试时可设为 false
      embedding:
        max-batch-size: 10        #
      chunk-size: 500                 # 单个 chunk 的 token 数
      chunk-overlap: 50              # 相邻 chunk 的重叠 token 数
      similarity-threshold: 0.6  # 向量相似度过滤阈值，低于此值的文档被丢弃 (bge-m3 cosine scores are typically 0.4-0.65)
      default-top-k: 5            # 最终返回的文档数
      rerank-enabled: true        # 是否启用召回后的二阶段重排
      reranker:
        type: heuristic           # heuristic | cross-encoder
        min-score: 0.0            # cross-encoder rerank 分数下限，低于此分的文档被丢弃（0 = 关闭）
      hybrid-enabled: true        # 是否启用 BM25 + Dense 混合召回
      sparse:
        text-search-config: english  # PostgreSQL FTS 配置名，例如 english | simple | custom config
      cross-encoder:
        base-url: ""              # 可选：cross-encoder rerank 服务地址，例如 http://localhost:8081
        rerank-path: /rerank      # rerank 接口路径，默认请求体含 query/documents/top_n
        model: ""                 # 可选：请求体中的模型名
        api-key: ""               # 可选：访问 rerank 服务的 API key
        api-key-header: Authorization
        api-key-prefix: "Bearer "
        max-document-chars: 4000  # 发送到 reranker 的单文档最大字符数
      category-classify-enabled: true  # 检索前是否用 LLM 自动分类 query 所属 category，false 时不加 category filter
      categories: 历史,法律,技术,医疗,金融,教育,general  # 逗号分隔字符串，@Value 自动切成 List；勿用 [..] 列表语法
      query-rewrite-enabled: true  # 检索前是否用 LLM 改写查询，false 时原样传入
      hyde-enabled: true          # 检索前是否用 HyDE 生成假设文档作为查询，默认关闭（每次调用 +1 次 LLM）
      max-calls-per-session: 3    # 每次请求最多 RAG 工具调用次数，独立于 maxSteps
    subagent:
      max-dispatches-per-session: 3   # 单次主对话最多派发 sub-agent 次数（与 rag.max-calls-per-session 对称）
      block-after-empty-searches: 2   # 连续空结果 N 次后阻止继续派发
      research:
        max-steps: 15                  # research sub-agent 内部 ReAct 步数上限（高于主 Agent 因为干重活）
        timeout-seconds: 60            # research sub-agent 总超时（秒），触发软失败返回 partial
        # model-override:              # 留空则与主 Agent 同模型；填值则覆盖
        # temperature-override:        # 留空则与主 Agent 同温度
    system-prompt: |
      You are Dawn AI, a helpful and knowledgeable assistant powered by advanced AI.
      You can help with calculations, weather queries, and answer questions based on your knowledge base.
      Always be concise, accurate, and helpful.
      Before calling a tool, briefly explain your reasoning in one sentence.
  tools:
    web-search:
      api-url: ""                        # 搜索 API 端点，留空则该工具不可用
      api-key: ""                        # 搜索 API 密钥
      provider: serpapi                  # 提供商：serpapi / bing / custom
      max-results: 5                     # 单次搜索最大结果数
    web-fetch:
      max-bytes: 512000                  # 抓取网页最大字节数（500KB）
      timeout-seconds: 15               # 抓取超时秒数
    bash:
      timeout-seconds: 30               # Bash 命令执行超时秒数
      max-output-bytes: 51200           # 命令输出最大字节数（50KB）
      max-consecutive-failures: 3       # 连续失败或空输出达到阈值后，返回停止继续调用 BashTool 的观察结果
    file:
      base-dir: ./                       # 文件操作基准目录

  skills:
    enabled: true
    path: ${APP_SKILLS_PATH:./skills}   # 外挂 skill 目录；classpath skills-builtin/ 永远作为兜底

  memory:
    default-user-id: local-user        # 单用户部署：固定 userId，让长期记忆跨会话（sessionId）生效
    max-history: 10                    # 每个 sessionId 的消息历史最大条数，超过时最早的消息会被丢弃到 pending list（Redis 列表）以备后续分析
    search:
      importance-weight: 0.3           # 召回加权：finalScore = similarity * (1 + w * importance)
    injection:
      procedural-top-k: 2              # 注入 system prompt 的 PROCEDURAL 记忆条数
      semantic-top-k: 3               # 注入 system prompt 的 SEMANTIC 记忆条数
    summary:
      batch-size: 4
    extraction:
      enabled: true                    # 是否启用 fact extraction（对齐 mem0）
    dedup:
      semantic-enabled: true           # 语义去重：fact 写入前用向量相似度拦同义改写
      semantic-top-k: 10                # 语义去重候选数：先向量召回 topK，再交给 LLM 判断是否重复
    consolidation:
      reflection-threshold: 3
    eviction:
      cron: "0 0 3 * * ?"
      importance-threshold: 0.1
      max-age-days: 2
    decay:
      cron: "0 30 3 * * ?"     # 每天 03:30，eviction (03:00) 之后运行
      half-life-days: 30        # 30 天无访问后 importance 减半
      min-importance: 0.01      # importance 衰减下限，低于此值保持不变
      batch-size: 500           # 每次扫描文档数上限
    reflection:
      episode-threshold: 4 # ReflectionWorker 至少需要 ≥2 个 episode 才执行

logging:
  level:
    com.dawn.ai: DEBUG
    org.springframework.ai: INFO
    # 打印 Hibernate 实际执行的 SQL 及参数绑定（走 logback，落盘到 app.log）
    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36}:%line - %msg%n"

# Langfuse environment label, attached as OTel resource attribute
langfuse:
  environment: ${LANGFUSE_ENVIRONMENT:dev}
