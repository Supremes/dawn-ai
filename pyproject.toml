[project]
name = "dawn-ai"
version = "1.0.0"
description = "Dawn AI - Python LangChain/LangGraph实现"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.2",
    "langgraph>=1.2.2",
    "langchain-openai>=1.2.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "redis>=8.0.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dawn_ai"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
dawn-ai = "dawn_ai.__main__:main"
